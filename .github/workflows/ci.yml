name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Rust checks · macOS ARM64
    runs-on: macos-26
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the minimum supported Rust toolchain
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt,clippy
          rustup default 1.88.0

      - name: Cache Cargo data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-rust-1.88.0-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-rust-1.88.0-

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint with warnings denied
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run all tests
        run: cargo test --locked --all-targets

      - name: Build the release binary
        run: cargo build --locked --release

      - name: Smoke-test read-only commands
        run: |
          ./target/release/clean --version
          ./target/release/clean doctor
