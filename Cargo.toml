[package]
name = "clean-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A safety-first macOS cache cleaner with a polished terminal UI"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Gianlz/CLEAN"
homepage = "https://github.com/Gianlz/CLEAN"
keywords = ["macos", "cache", "cleaner", "tui", "ratatui"]
categories = ["command-line-utilities"]
publish = false

[[bin]]
name = "clean"
path = "src/main.rs"

[dependencies]
crossterm = "0.29.0"
libc = "0.2.189"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
uzers = { version = "0.12.2", default-features = false }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
